[project]
name = "berlin-temp-aws"
version = "0.1.0"
description = "Berlin neighborhood apparent-temperature forecast as a serverless AWS data pipeline"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
# Runtime dependencies of the container images (see Dockerfile).
pipeline = [
    "boto3",
    "eccodes",
    "numpy",
    "pandas",
    "pyarrow",
]
reference = [
    "netCDF4",
    "openpyxl",
    "pyproj",
    "shapely",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/berlin_temp"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
